spring:
  application:
    name: chelsea

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  servlet:
    multipart:
      enabled: true
  jpa:
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

