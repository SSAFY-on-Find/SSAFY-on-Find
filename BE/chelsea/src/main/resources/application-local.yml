spring:
  config:
    activate:
      on-profile: local

  sql:
    init:
      mode: always
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_HOST_PORT}/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
    defer-datasource-initialization: true

  data:
    redis:
      host: localhost
      port: ${REDIS_HOST_PORT}
    mongodb:
      uri: mongodb://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@localhost:${MONGO_HOST_PORT}/${MONGO_DB_NAME}?authSource=admin

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.messaging: INFO
    org.springframework.web.socket: INFO

upload:
  dir: C:/ssafy/dev/uploads

custom:
  service:
    url: "http://localhost:8080"

notification:
  dispatch:
    publishSpringEvent: false
    publishSpringEventForResponse: false
  streams:
    stream: notification_stream
    group: notif_group
    dlq: notification_stream:dlq
    min-idle-ms: 60000
    reclaim-interval-ms: 30000
    scan-pending-interval-ms: 60000
    max-deliveries: 5
